<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/src/assets/nocturne-icon.png" type="image/png" />
    <link rel="stylesheet" href="/src/startup.css" />
    <title>Nocturne Studio</title>
  </head>
  <body>
    <section id="startup-screen" aria-labelledby="startup-brand">
      <div class="startup-panel">
        <div class="startup-cover" aria-hidden="true">
          <img src="/src/assets/nocturne-cover.webp" alt="" />
        </div>
        <div class="startup-content">
          <div class="startup-mark" aria-hidden="true">
            <img src="/src/assets/nocturne-icon.png" width="72" height="72" alt="" />
          </div>
          <h1 id="startup-brand" dir="ltr">Nocturne Studio</h1>
          <p id="startup-status" role="status">در حال راه‌اندازی…</p>
          <p id="startup-details" hidden></p>
          <ol class="startup-steps" id="startup-steps" role="list"></ol>
          <p id="startup-slow" hidden></p>
          <div class="startup-actions" hidden>
            <button type="button" id="startup-retry"></button>
            <button type="button" id="startup-continue"></button>
          </div>
        </div>
      </div>
    </section>
    <div id="app" inert></div>
    <script>
      try {
        if (localStorage.getItem('nocturne-language') !== 'fa') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
          document.getElementById('startup-status').textContent = 'Starting up…';
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
