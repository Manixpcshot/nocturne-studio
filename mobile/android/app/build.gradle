plugins {
    id 'com.android.application'
}

def engine = providers.gradleProperty('nocturneEngine').getOrElse(rootProject.file('vendor/stable-diffusion.cpp').absolutePath)

android {
    namespace 'studio.nocturne.mobile'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'studio.nocturne.mobile'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DNOCTURNE_ENGINE=${engine}", '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
