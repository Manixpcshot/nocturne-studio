name: Windows and Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected release tag after both builds succeed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the Windows version.' }
          ./scripts/build-windows-release.ps1 -Output "$env:RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sig
            ${{ runner.temp }}/release/latest.json
          if-no-files-found: error

  android:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android and Vulkan toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          $tools = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $tools --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'
          if ($LASTEXITCODE) { throw 'Android SDK installation failed.' }
          $deps = Join-Path $env:RUNNER_TEMP 'nocturne-deps'
          New-Item -ItemType Directory -Force $deps | Out-Null
          $compiler = Join-Path $deps 'host.7z.exe'
          Invoke-WebRequest 'https://github.com/skeeto/w64devkit/releases/download/v2.11.0/w64devkit-x64-2.11.0.7z.exe' -OutFile $compiler
          if ((Get-FileHash $compiler).Hash -ne '54C2BB9962E8A30C8270E34C5EFC3D5FEE579F53087FA7D435B95FBBA2AF7B2B') { throw 'Unexpected host compiler digest.' }
          & 7z x -y "-o$deps/host" $compiler
          if ($LASTEXITCODE) { throw 'Compiler extraction failed.' }
          $gcc = Get-ChildItem "$deps/host" -Recurse -Filter gcc.exe | Select-Object -First 1
          if (!$gcc) { throw 'Host compiler is missing.' }
          $cmake = "$sdk/cmake/3.31.6/bin"
          $env:PATH = "$($gcc.DirectoryName);$cmake;$env:PATH"
          $gcc.DirectoryName,$cmake | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          git clone --depth 1 --branch vulkan-sdk-1.4.350.1 https://github.com/KhronosGroup/SPIRV-Headers.git "$deps/SPIRV-Headers"
          if ($LASTEXITCODE) { throw 'SPIR-V headers checkout failed.' }
          git clone --depth 1 --branch v1.4.350 https://github.com/KhronosGroup/Vulkan-Headers.git "$deps/Vulkan-Headers"
          if ($LASTEXITCODE) { throw 'Vulkan headers checkout failed.' }
          & "$cmake/cmake.exe" -S "$deps/SPIRV-Headers" -B "$deps/spirv-build" -G Ninja "-DCMAKE_INSTALL_PREFIX=$deps/spirv" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          if ($LASTEXITCODE) { throw 'SPIR-V headers configuration failed.' }
          & "$cmake/cmake.exe" --install "$deps/spirv-build"
          if ($LASTEXITCODE) { throw 'SPIR-V headers installation failed.' }
      - name: Build and verify Android APK
        shell: pwsh
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:ANDROID_SIGNING_KEY_BASE64) { throw 'ANDROID_SIGNING_KEY_BASE64 is missing.' }
          $key = Join-Path $env:RUNNER_TEMP 'nocturne-signing.jks'
          [IO.File]::WriteAllBytes($key,[Convert]::FromBase64String($env:ANDROID_SIGNING_KEY_BASE64))
          Remove-Item Env:ANDROID_SIGNING_KEY_BASE64
          try {
            $deps = Join-Path $env:RUNNER_TEMP 'nocturne-deps'
            $version = (Select-String -Path mobile/android/app/build.gradle -Pattern "versionName '([^']+)'").Matches[0].Groups[1].Value
            ./mobile/android/build-apk.ps1 -Sdk $env:ANDROID_HOME -SigningKey $key -VulkanHeaders "$deps/Vulkan-Headers/include" -SpirvConfig "$deps/spirv/share/cmake/SPIRV-Headers" -Output "$env:RUNNER_TEMP/release/Nocturne-Mobile-$version-Android-arm64.apk"
            $signer = & "$env:ANDROID_HOME/build-tools/35.0.0/apksigner.bat" verify --print-certs "$env:RUNNER_TEMP/release/Nocturne-Mobile-$version-Android-arm64.apk"
            if ($LASTEXITCODE -or !($signer -match '^Signer #1 certificate SHA-256 digest: a8668b27488cc58c229e3f657cc4a5b2ceea3e4e565528bf3001b5adc4bc9671$')) {
              throw 'The APK does not match the published Android signing certificate.'
            }
          } finally {
            Remove-Item -LiteralPath $key
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/release/*.apk
          if-no-files-found: error

  publish:
    needs: [tests, windows, android]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -- *.exe *.zip *.apk *.sig latest.json > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$RUNNER_TEMP/release.json"
            if jq -e '.isDraft | not' "$RUNNER_TEMP/release.json" >/dev/null; then
              jq -e '[.assets[].name] | any(endswith(".exe")) and any(endswith(".zip")) and any(endswith(".apk")) and any(. == "SHA256SUMS.txt") and any(. == "latest.json") and any(endswith(".exe.sig"))' "$RUNNER_TEMP/release.json" >/dev/null
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Nocturne Studio $GITHUB_REF_NAME · Windows + Android" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber -- *.exe *.zip *.apk *.sig latest.json SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
